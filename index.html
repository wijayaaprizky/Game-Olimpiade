<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Olimpiade Matematika TK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
        .pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .bg-pattern {
            background-color: #e0f2fe;
            background-image: radial-gradient(#bae6fd 20%, transparent 20%);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-pattern h-screen flex flex-col items-center justify-center overflow-hidden select-none">

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 bg-blue-600 flex flex-col items-center justify-center z-50 transition-opacity duration-500">
        <h1 class="text-5xl md:text-7xl text-white font-black mb-4 drop-shadow-lg text-center leading-tight">Simulasi<br>Olimpiade TK</h1>
        <p class="text-blue-200 text-2xl font-bold mb-10">Raih Medali Emasmu!</p>
        <button onclick="startGame()" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 font-black text-4xl py-6 px-12 rounded-full shadow-[0_10px_0_rgb(180,83,9)] active:translate-y-2 active:shadow-none transition-all border-4 border-yellow-100">
            ▶ MULAI LATIHAN
        </button>
    </div>

    <!-- Reward Screen -->
    <div id="reward-screen" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-40 hidden">
        <h2 id="reward-text" class="text-5xl font-black text-blue-800 mb-8 drop-shadow-md pop"></h2>
        <div id="medal-container" class="pop"></div>
    </div>

    <!-- UI Header -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center px-4">
        <div class="bg-white/80 px-6 py-2 rounded-full font-black text-blue-800 text-2xl border-4 border-white shadow-sm">
            Skor: <span id="score-display">0</span>
        </div>
    </div>

    <!-- Pertanyaan -->
    <h2 id="question-text" class="text-3xl md:text-4xl font-black text-blue-900 mb-6 text-center px-4 drop-shadow-md min-h-[48px]"></h2>
    
    <!-- Area Visual Soal -->
    <div id="visual-area" class="flex items-center justify-center gap-4 mb-10 bg-white/90 p-8 rounded-[3rem] shadow-xl border-8 border-white backdrop-blur-md w-11/12 max-w-3xl min-h-[200px]">
        <!-- Konten disuntik via JS -->
    </div>

    <!-- Pilihan Jawaban -->
    <div id="options" class="flex flex-wrap gap-6 justify-center w-full max-w-3xl px-4"></div>

    <script>
        let correctAnswer = 0;
        let score = 0;

        const svgApple = `<svg viewBox="0 0 100 100" class="w-16 h-16 md:w-20 md:h-20 drop-shadow-md pop"><path d="M50 30 C 60 10, 80 20, 70 40 C 60 40, 50 30, 50 30" fill="#4ade80" /><path d="M50 35 L 55 20" stroke="#78350f" stroke-width="4" stroke-linecap="round"/><path d="M25 40 C 25 20, 50 25, 50 35 C 50 25, 75 20, 75 40 C 85 60, 70 85, 50 90 C 30 85, 15 60, 25 40 Z" fill="#ef4444" /></svg>`;
        
        function getMedalSvg(colorMain, colorShadow, text) {
            return `<svg viewBox="0 0 100 100" class="w-64 h-64 drop-shadow-2xl">
                <path d="M30 10 L40 40 L60 40 L70 10 Z" fill="#1e3a8a"/>
                <circle cx="50" cy="55" r="40" fill="${colorShadow}" stroke="#ffffff" stroke-width="2"/>
                <circle cx="50" cy="55" r="32" fill="${colorMain}" />
                <text x="50" y="62" font-family="Nunito, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">${text}</text>
            </svg>`;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function startGame() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('start-screen').style.display = 'none'; }, 500);
            score = 0;
            document.getElementById('score-display').innerText = score;
            nextQuestion();
        }

        function nextQuestion() {
            const type = Math.floor(Math.random() * 3); // 0: Penjumlahan, 1: Angka Terbesar, 2: Pola Urutan
            
            if (type === 0) generateAddition();
            else if (type === 1) generateComparison();
            else generateSequence();
        }

        function generateAddition() {
            const n1 = Math.floor(Math.random() * 4) + 1;
            const n2 = Math.floor(Math.random() * 3) + 1;
            correctAnswer = n1 + n2;

            document.getElementById('question-text').innerText = "Berapa jumlah semua apelnya?";
            speak("Berapa jumlah semua apelnya?");

            document.getElementById('visual-area').innerHTML = `
                <div class="flex flex-wrap gap-2 justify-center w-5/12">${Array(n1).fill(svgApple).join('')}</div>
                <div class="text-6xl font-black text-blue-400 w-2/12 text-center">+</div>
                <div class="flex flex-wrap gap-2 justify-center w-5/12">${Array(n2).fill(svgApple).join('')}</div>
            `;
            generateOptions(correctAnswer, Math.max(4, correctAnswer + 3));
        }

        function generateComparison() {
            let nums = [];
            while(nums.length < 3) {
                let r = Math.floor(Math.random() * 10) + 1;
                if(nums.indexOf(r) === -1) nums.push(r);
            }
            correctAnswer = Math.max(...nums);

            document.getElementById('question-text').innerText = "Pilih angka yang paling besar!";
            speak("Pilih angka yang paling besar!");
            document.getElementById('visual-area').innerHTML = `<div class="text-4xl font-black text-gray-500">???</div>`;
            
            renderOptionsCustom(nums);
        }

        function generateSequence() {
            const start = Math.floor(Math.random() * 5) + 1;
            const seq = [start, start+1, start+2, start+3];
            const hiddenIndex = Math.floor(Math.random() * 4);
            correctAnswer = seq[hiddenIndex];
            
            let displaySeq = [...seq];
            displaySeq[hiddenIndex] = "?";

            document.getElementById('question-text').innerText = "Angka berapa yang hilang?";
            speak("Angka berapa yang hilang?");

            document.getElementById('visual-area').innerHTML = displaySeq.map(n => 
                `<div class="${n === '?' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-blue-800'} 
                w-20 h-20 md:w-24 md:h-24 flex items-center justify-center text-5xl font-black rounded-2xl shadow-inner border-4 border-gray-200">
                ${n}</div>`
            ).join('<div class="text-3xl text-gray-300 font-black mt-6">,</div>');

            generateOptions(correctAnswer, 10);
        }

        function generateOptions(correct, maxLimit) {
            let options = [correct];
            while(options.length < 3) {
                let wrong = Math.floor(Math.random() * maxLimit) + 1;
                if(!options.includes(wrong)) options.push(wrong);
            }
            options.sort(() => Math.random() - 0.5);
            renderOptionsCustom(options);
        }

        function renderOptionsCustom(optionsArray) {
            const container = document.getElementById('options');
            container.innerHTML = '';
            optionsArray.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'bg-white text-blue-600 border-4 border-blue-200 font-black text-5xl md:text-6xl w-32 h-32 md:w-40 md:h-40 rounded-[2.5rem] shadow-[0_8px_0_rgb(191,219,254)] active:shadow-none active:translate-y-2 transition-all flex items-center justify-center';
                btn.innerText = num;
                btn.onclick = () => checkAnswer(num, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btnElement) {
            if (selected === correctAnswer) {
                score++;
                document.getElementById('score-display').innerText = score;
                
                btnElement.classList.replace('bg-white', 'bg-green-400');
                btnElement.classList.replace('text-blue-600', 'text-white');
                btnElement.style.boxShadow = '0 8px 0 rgb(34,197,94)';

                if (score === 3 || score === 6 || score === 10) {
                    showMedal(score);
                } else {
                    speak("Pintar!");
                    setTimeout(nextQuestion, 1000);
                }
            } else {
                speak("Ups, coba lagi.");
                btnElement.classList.add('shake', 'bg-red-400', 'text-white');
                btnElement.classList.replace('bg-white', 'bg-red-400');
                btnElement.classList.replace('text-blue-600', 'text-white');
                btnElement.style.boxShadow = '0 8px 0 rgb(239,68,68)';
                
                setTimeout(() => {
                    btnElement.classList.remove('shake', 'bg-red-400', 'text-white');
                    btnElement.classList.add('bg-white', 'text-blue-600');
                    btnElement.style.boxShadow = '0 8px 0 rgb(191,219,254)';
                }, 800);
            }
        }

        function showMedal(currentScore) {
            const rewardScreen = document.getElementById('reward-screen');
            const medalContainer = document.getElementById('medal-container');
            const rewardText = document.getElementById('reward-text');
            
            let colorMain, colorShadow, textMsg, voiceMsg;

            if (currentScore === 3) {
                colorMain = '#d97706'; colorShadow = '#b45309'; textMsg = 'MEDALI PERUNGGU!'; voiceMsg = 'Luar biasa! Kamu dapat medali perunggu!'; // Bronze
            } else if (currentScore === 6) {
                colorMain = '#9ca3af'; colorShadow = '#6b7280'; textMsg = 'MEDALI PERAK!'; voiceMsg = 'Hebat! Kamu dapat medali perak!'; // Silver
            } else if (currentScore === 10) {
                colorMain = '#fbbf24'; colorShadow = '#d97706'; textMsg = 'MEDALI EMAS!'; voiceMsg = 'Sempurna! Kamu juara satu, dapat medali emas!'; // Gold
            }

            speak(voiceMsg);
            rewardText.innerText = textMsg;
            medalContainer.innerHTML = getMedalSvg(colorMain, colorShadow, textMsg.split(' ')[1]);
            
            rewardScreen.classList.remove('hidden');

            setTimeout(() => {
                rewardScreen.classList.add('hidden');
                if(currentScore === 10) startGame(); // Reset setelah Emas
                else nextQuestion();
            }, 4000);
        }
    </script>
</body>
</html>
