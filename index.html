<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Olimpiade Matematika TK Ceria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; overflow: hidden; touch-action: manipulation; }
        
        .bg-pattern {
            background-color: #fef08a;
            background-image: radial-gradient(#fde047 20%, transparent 20%);
            background-size: 50px 50px;
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-5deg); }
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(5deg); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-5deg); }
            40%, 60% { transform: translate3d(8px, 0, 0) rotate(5deg); }
        }

        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .btn-ceria { transition: all 0.1s ease; }
        .btn-ceria:active {
            transform: scale(0.9) translateY(4px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.2) !important;
        }
    </style>
</head>
<body class="bg-pattern h-screen flex flex-col items-center justify-center select-none">

    <!-- Pemutar Musik Latar (Menggunakan Server Mixkit yang aman dari blokir) -->
    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-happy-times-158.mp3" type="audio/mpeg">
    </audio>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 bg-pink-400 flex flex-col items-center justify-center z-50 transition-opacity duration-500">
        <h1 class="text-6xl md:text-8xl text-white font-black mb-6 drop-shadow-xl text-center leading-tight pop-in">Ayo Main<br>Matematika!</h1>
        <button onclick="startGame()" class="btn-ceria bg-yellow-300 hover:bg-yellow-200 text-yellow-900 font-black text-4xl md:text-5xl py-6 px-12 rounded-[3rem] shadow-[0_12px_0_rgb(202,138,4)] border-4 border-white mt-8 pop-in" style="animation-delay: 0.2s;">
            Mulai! 🚀
        </button>
    </div>

    <!-- UI Header -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center px-4 z-10">
        <div class="bg-white/90 px-6 py-3 rounded-[2rem] font-black text-pink-600 text-3xl border-4 border-pink-200 shadow-lg">
            ⭐ Bintang: <span id="score-display">0</span>
        </div>
    </div>

    <!-- Area Pertanyaan & Visual -->
    <div class="flex flex-col items-center w-full max-w-4xl px-4 mt-16">
        <h2 id="question-text" class="text-3xl md:text-5xl font-black text-pink-700 mb-8 text-center drop-shadow-sm min-h-[60px] bg-white/70 px-8 py-4 rounded-[2rem] border-4 border-white shadow-sm"></h2>
        
        <div id="visual-area" class="flex flex-wrap items-center justify-center gap-6 mb-12 bg-white/95 p-8 rounded-[3rem] shadow-2xl border-8 border-pink-100 min-h-[200px] w-full"></div>

        <div id="options" class="flex flex-wrap gap-6 justify-center w-full"></div>
    </div>
